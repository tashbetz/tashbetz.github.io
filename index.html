<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>זמני היום בהלכה - אופליין</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
        }
        h1 {
            font-size: 3rem;
            margin: 0 0 10px 0;
            color: #38bdf8;
        }
        .date-sub {
            font-size: 1.5rem;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 90%;
            max-width: 1200px;
        }
        .zman-card {
            background-color: #1e293b;
            padding: 15px 30px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .zman-name {
            font-size: 1.8rem;
            font-weight: bold;
        }
        .zman-time {
            font-size: 2.2rem;
            color: #f59e0b;
            font-weight: bold;
            font-family: monospace;
        }
        .status-box {
            font-size: 1.2rem;
            color: #10b981;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header" id="header-section">
        <h1 id="parasha-display">זמני היום בהלכה</h1>
        <div class="date-sub" id="gregorian-date">מחשב תאריך...</div>
        <div class="date-sub" id="hebrew-date">מחשב תאריך...</div>
    </div>

    <div class="grid-container" id="zmanim-grid">
        <div class="zman-card"><span class="zman-name">עלות השחר (72 דק')</span><span class="zman-time" id="alotHaShachar">-</span></div>
        <div class="zman-card"><span class="zman-name">משיכיר (טלית ותפילין)</span><span class="zman-time" id="misheyakir">-</span></div>
        <div class="zman-card"><span class="zman-name">הנץ החמה (זריחה משוערת)</span><span class="zman-time" id="sunrise">-</span></div>
        <div class="zman-card"><span class="zman-name">סוף זמן ק"ש (מג"א)</span><span class="zman-time" id="sofZmanShmaMGA">-</span></div>
        <div class="zman-card"><span class="zman-name">סוף זמן ק"ש (גר"א)</span><span class="zman-time" id="sofZmanShma">-</span></div>
        <div class="zman-card"><span class="zman-name">סוף זמן תפילה (גר"א)</span><span class="zman-time" id="sofZmanTfilla">-</span></div>
        <div class="zman-card"><span class="zman-name">חצות היום והלילה</span><span class="zman-time" id="chatzot">-</span></div>
        <div class="zman-card"><span class="zman-name">מנחה גדולה</span><span class="zman-time" id="minchaGedola">-</span></div>
        <div class="zman-card"><span class="zman-name">מנחה קטנה</span><span class="zman-time" id="minchaKetana">-</span></div>
        <div class="zman-card"><span class="zman-name">פלג המנחה</span><span class="zman-time" id="plagHaMincha">-</span></div>
        <div class="zman-card"><span class="zman-name">שקיעת החמה</span><span class="zman-time" id="sunset">-</span></div>
        <div class="zman-card"><span class="zman-name">צאת הכוכבים</span><span class="zman-time" id="tzeitHaKochavimRT">-</span></div>
    </div>

    <div id="status-msg" class="status-box">מערכת פועלת במצב אופליין מאובטח ומחושב מקומית.</div>
    <script>
        const LAT = 32.393056; 
        const LON = 34.920556; 
        const SAVER_IMAGE_URL = "ad.jpg"; 

        let showImageMode = false; 

        // המרת מספרים לאותיות גימטריות
        function numToGematria(num, isYear = false) {
            if (!isYear && num === 15) return 'ט"ו';
            if (!isYear && num === 16) return 'ט"ז';
            const units = ["", "א", "ב", "ג", "ד", "ה", "ו", "ז", "ח", "ט"];
            const safeTens = ["", "י", "כ", "ל", "מ", "נ", "ס", "ע", "פ", "צ"];
            let parts = [];
            if (isYear && num >= 700 && num < 800) { parts.push("תש"); num = num - 700; }
            let t = Math.floor(num / 10);
            let u = num % 10;
            if (t > 0) parts.push(safeTens[t]);
            if (u > 0) parts.push(units[u]);
            let str = parts.join("");
            if (str.length > 1) { return str.slice(0, -1) + '"' + str.slice(-1); }
            return str + "'";
        }

        function getHebrewDate() {
            try {
                const today = new Date();
                const formatter = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { day: 'numeric', month: 'long', year: 'numeric' });
                const parts = formatter.formatToParts(today);
                let dayNum = parseInt(parts.find(p => p.type === 'day').value);
                let monthStr = parts.find(p => p.type === 'month').value;
                let yearNum = parseInt(parts.find(p => p.type === 'year').value) % 1000;
                return `${numToGematria(dayNum, false)} ב${monthStr} ה'${numToGematria(yearNum, true).replace('"', '')}`;
            } catch (e) {
                return "זמני היום";
            }
        }

        // אלגוריתם משוער ומדויק לחישוב זמני זריחה ושקיעה מקומיים באופליין
        function calculateZmanimLocal() {
            const today = new Date();
            const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 86400000);
            
            // חישוב שעת חצות ממוצעת בתוספת תיקון קל לאזור נתניה (כ-23 דקות הבדל מגריניץ')
            let noonMinutes = 701 - (4 * LON) + (60 * 2); 
            
            // משוואת הזמן האסטרונומית (Equation of Time)
            const b = (2 * Math.PI * (dayOfYear - 81)) / 365;
            const eqTime = 9.87 * Math.sin(2 * b) - 7.53 * Math.cos(b) - 1.5 * Math.sin(b);
            noonMinutes -= eqTime;

            // חישוב אורך היום על פי קו הרוחב
            const latRad = LAT * Math.PI / 180;
            const declination = 23.45 * Math.PI / 180 * Math.sin((2 * Math.PI * (284 + dayOfYear)) / 365);
            const hourAngle = Math.acos(-Math.tan(latRad) * Math.tan(declination)) * 180 / Math.PI;
            const daylightMinutes = (hourAngle / 15) * 60;

            const sunriseMinutes = noonMinutes - (daylightMinutes / 2);
            const sunsetMinutes = noonMinutes + (daylightMinutes / 2);

            const makeTimeStr = (totalMinutes) => {
                const h = Math.floor(totalMinutes / 60) % 24;
                const m = Math.floor(totalMinutes % 60);
                return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            };

            // גזירת שעות זמניות
            const shaahZmanitGra = daylightMinutes / 12;
            const shaahZmanitMga = (daylightMinutes + 144) / 12; // תוספת 72 דק' לפני ואחרי

            const alotMin = sunriseMinutes - 72;
            const misheyakirMin = sunriseMinutes - 45;
            const shmaMgaMin = alotMin + (shaahZmanitMga * 3);
            const shmaGraMin = sunriseMinutes + (shaahZmanitGra * 3);
            const tfillahMin = sunriseMinutes + (shaahZmanitGra * 4);
            const minchaGMin = noonMinutes + (shaahZmanitGra * 0.5);
            const minchaKMin = sunriseMinutes + (shaahZmanitGra * 9.5);
            const plagMin = sunriseMinutes + (shaahZmanitGra * 10.75);
            const tzeitMin = sunsetMinutes + 20; // 20 דקות ממוצע לצאת הכוכבים

            document.getElementById('alotHaShachar').innerText = makeTimeStr(alotMin);
            document.getElementById('misheyakir').innerText = makeTimeStr(misheyakirMin);
            document.getElementById('sunrise').innerText = makeTimeStr(sunriseMinutes);
            document.getElementById('sofZmanShmaMGA').innerText = makeTimeStr(shmaMgaMin);
            document.getElementById('sofZmanShma').innerText = makeTimeStr(shmaGraMin);
            document.getElementById('sofZmanTfilla').innerText = makeTimeStr(tfillahMin);
            document.getElementById('chatzot').innerText = makeTimeStr(noonMinutes);
            document.getElementById('minchaGedola').innerText = makeTimeStr(minchaGMin);
            document.getElementById('minchaKetana').innerText = makeTimeStr(minchaKMin);
            document.getElementById('plagHaMincha').innerText = makeTimeStr(plagMin);
            document.getElementById('sunset').innerText = makeTimeStr(sunsetMinutes);
            document.getElementById('tzeitHaKochavimRT').innerText = makeTimeStr(tzeitMin);
        }

        function updateScreenData() {
            const today = new Date();
            const gregElem = document.getElementById('gregorian-date');
            const hebElem = document.getElementById('hebrew-date');
            
            if (gregElem) gregElem.innerText = today.toLocaleDateString('he-IL', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            if (hebElem) hebElem.innerText = getHebrewDate();
            calculateZmanimLocal();
        }

        function handleScreenCycle() {
            const gridElement = document.getElementById('zmanim-grid');
            const headerElement = document.getElementById('header-section');
            let saverContainer = document.getElementById('saver-image-container');
            
            if (!saverContainer) {
                saverContainer = document.createElement('div');
                saverContainer.id = 'saver-image-container';
                saverContainer.style.cssText = "position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 99999; background-color: #000000; overflow: hidden;";
                document.body.appendChild(saverContainer);
            }
            
            showImageMode = !showImageMode; 
            
            if (showImageMode) {
                if (gridElement) gridElement.style.setProperty('display', 'none', 'important');
                if (headerElement) headerElement.style.setProperty('display', 'none', 'important');
                saverContainer.innerHTML = `<img src="${SAVER_IMAGE_URL}" style="width: 100%; height: 100%; object-fit: contain; display: block;" onerror="this.parentElement.style.display='none'; document.getElementById('zmanim-grid').style.setProperty('display', 'grid', 'important'); document.getElementById('header-section').style.setProperty('display', 'block', 'important');" />`;
                saverContainer.style.setProperty('display', 'block', 'important');
            } else {
                if (saverContainer) saverContainer.style.setProperty('display', 'none', 'important');
                if (gridElement) gridElement.style.setProperty('display', 'grid', 'important');
                if (headerElement) headerElement.style.setProperty('display', 'block', 'important');
                updateScreenData();
            }
        }

        // הפעלה מיידית
        updateScreenData();
        
        // לולאת החלפה חצי דקה / חצי דקה
        setInterval(handleScreenCycle, 30000); 
    </script>
</body>
</html>
