<script>
    const LAT = 32.393056; 
    const LON = 34.920556; 

    // הגדר כאן את שם קובץ התמונה שהעלית ל-GitHub (למשל: ad.jpg)
    const SAVER_IMAGE_URL = "ad.jpg"; 

    let globalZmanimData = null;
    let globalParasha = "";
    
    // false = מציג לוח זמנים | true = מציג תמונה
    let showImageMode = false; 

    function formatTime(isoString) {
        if (!isoString || isoString === "-") return "-";
        const date = new Date(isoString);
        return date.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    // המרת מספרים לאותיות גימטריות (תשפ"ו, ט"ו, ט"ז)
    function numToGematria(num, isYear = false) {
        if (!isYear && num === 15) return 'ט"ו';
        if (!isYear && num === 16) return 'ט"ז';
        
        const units = ["", "א", "ב", "ג", "ד", "ה", "ו", "ז", "ח", "ט"];
        const safeTens = ["", "י", "כ", "ל", "מ", "נ", "ס", "ע", "פ", "צ"];
        let parts = [];
        
        if (isYear && num >= 700 && num < 800) {
            parts.push("תש"); 
            num = num - 700;
        }
        
        let t = Math.floor(num / 10);
        let u = num % 10;
        
        if (t > 0) parts.push(safeTens[t]);
        if (u > 0) parts.push(units[u]);
        
        let str = parts.join("");
        if (str.length > 1) {
            return str.slice(0, -1) + '"' + str.slice(-1);
        } else if (str.length === 1) {
            return str + "'";
        }
        return str;
    }

    // הפקת תאריך עברי אופליין לחלוטין מתוך מערכת המכשיר
    function getFallbackHebrewDate() {
        const today = new Date();
        const formatter = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { day: 'numeric', month: 'long', year: 'numeric' });
        const parts = formatter.formatToParts(today);
        
        let dayNum = parseInt(parts.find(p => p.type === 'day').value);
        let monthStr = parts.find(p => p.type === 'month').value;
        let yearNum = parseInt(parts.find(p => p.type === 'year').value) % 1000;

        return `${numToGematria(dayNum, false)} ב${monthStr} ה'${numToGematria(yearNum, true).replace('"', '')}`;
    }

    // מילוי הנתונים בטבלה בצורה בטוחה שתואמת את ה-IDs באתר שלך
    function displayZmanim(zmanimData) {
        if (!zmanimData) return;
        
        const setTime = (id, val) => {
            const el = document.getElementById(id);
            if (el) el.innerText = formatTime(val);
        };

        setTime('alotHaShachar', zmanimData.alotDawn || zmanimData.alotHaShachar);
        setTime('misheyakir', zmanimData.misheyakir);
        setTime('sunrise', zmanimData.sunrise);
        setTime('sofZmanShmaMGA', zmanimData.sofZmanShmaMagenAvraham || zmanimData.sofZmanShmaMGA);
        setTime('sofZmanShma', zmanimData.sofZmanShmaGra || zmanimData.sofZmanShma);
        setTime('sofZmanTfilla', zmanimData.sofZmanTfillaGra || zmanimData.sofZmanTfilla);
        setTime('chatzot', zmanimData.chatzot);
        setTime('minchaGedola', zmanimData.minchaGedola);
        setTime('minchaKetana', zmanimData.minchaKetana);
        setTime('plagHaMincha', zmanimData.plagHamincha || zmanimData.plagHaMincha);
        setTime('sunset', zmanimData.sunset);
        setTime('tzeitHaKochavimRT', zmanimData.tzeit85deg || zmanimData.tzeitHaKochavim || zmanimData.tzeit);
    }
    function updateHeaderElements(hebrewDateStr, parashaStr) {
        const today = new Date();
        const gregElem = document.getElementById('gregorian-date') || document.getElementById('secular-date');
        const hebElem = document.getElementById('hebrew-date');
        const parashaElem = document.getElementById('parasha-display');

        if (gregElem) gregElem.innerText = today.toLocaleDateString('he-IL', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        if (hebElem) hebElem.innerText = hebrewDateStr || getFallbackHebrewDate();
        
        if (parashaElem) {
            if (parashaStr) {
                parashaElem.innerText = `פרשת השבוע: ${parashaStr}`;
                parashaElem.style.display = 'inline-block';
            } else {
                parashaElem.style.display = 'none';
            }
        }
    }

    // פונקציית ה-Fetch המתוקנת עם כתובות תקינות לחלוטין לשרת
    async function fetchZmanim() {
        if (!navigator.onLine) return;

        try {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const todayStr = `${yyyy}-${mm}-${dd}`;

            // הכתובות תוקנו עם סלאש וסימני דולר נכונים למניעת קריסה
            const zmanimUrl = `https://hebcal.com{LAT}&longitude=${LON}&date=${todayStr}`;
            const calendarUrl = `https://hebcal.com{todayStr}&end=${todayStr}&il=1&s=1`;

            const [zmanimRes, calRes] = await Promise.all([fetch(zmanimUrl), fetch(calendarUrl)]);
            if (!zmanimRes.ok || !calRes.ok) throw new Error("Network error");
            
            const zmanimData = await zmanimRes.json();
            const calData = await calRes.json();
            
            globalZmanimData = zmanimData.times;

            if (calData.items) {
                const parashaEvent = calData.items.find(item => item.category === "parashat");
                if (parashaEvent) globalParasha = parashaEvent.hebrew;
            }

            localStorage.setItem('zmanim_cache', JSON.stringify(globalZmanimData));
            localStorage.setItem('parasha_cache', globalParasha);

            if (!showImageMode) {
                displayZmanim(globalZmanimData);
                updateHeaderElements(getFallbackHebrewDate(), globalParasha);
            }
            
            // הסתרת הודעות שגיאה וטעינה במידה והצלחנו
            if (document.getElementById('status-msg')) document.getElementById('status-msg').style.display = 'none';
            if (document.getElementById('stuck-msg')) document.getElementById('stuck-msg').style.display = 'none';
        } catch (error) {
            console.log("Fetch failed, running on saved cache.", error);
        }
    }

    function loadCache() {
        const cachedData = localStorage.getItem('zmanim_cache');
        const cachedParasha = localStorage.getItem('parasha_cache');
        
        if (cachedData) globalZmanimData = JSON.parse(cachedData);
        if (cachedParasha) globalParasha = cachedParasha;

        updateHeaderElements(getFallbackHebrewDate(), globalParasha);
        if (globalZmanimData) displayZmanim(globalZmanimData);
    }

    // מנגנון מחזור החלפת המסכים - בדיוק כל 30 שניות
    function handleScreenCycle() {
        const gridElement = document.querySelector('.grid-container') || document.getElementById('zmanim-grid') || document.querySelector('table');
        const headerElement = document.querySelector('.header') || document.getElementById('header-section') || document.querySelector('h1')?.parentElement;
        const statusBox = document.getElementById('status-msg');
        const stuckMsg = document.getElementById('stuck-msg');

        let saverContainer = document.getElementById('saver-image-container');
        if (!saverContainer) {
            saverContainer = document.createElement('div');
            saverContainer.id = 'saver-image-container';
            saverContainer.style.cssText = "position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: none; z-index: 99999; background-color: #000000; overflow: hidden;";
            document.body.appendChild(saverContainer);
        }

        showImageMode = !showImageMode; 

        if (showImageMode) {
            // --- 30 שניות של מודעה/תמונה בגודל מלא ---
            if (gridElement) gridElement.style.setProperty('display', 'none', 'important');
            if (headerElement) headerElement.style.setProperty('display', 'none', 'important');
            if (statusBox) statusBox.style.display = 'none';
            if (stuckMsg) stuckMsg.style.display = 'none';

            saverContainer.innerHTML = `
                <img src="${SAVER_IMAGE_URL}" style="width: 100%; height: 100%; object-fit: contain; display: block;" />
            `;
            saverContainer.style.setProperty('display', 'block', 'important');
        } else {
            // --- 30 שניות של לוח זמני הלכה מלא ---
            if (saverContainer) saverContainer.style.setProperty('display', 'none', 'important');
            if (gridElement) gridElement.style.setProperty('display', gridElement.tagName === 'TABLE' ? 'table' : 'grid', 'important');
            if (headerElement) headerElement.style.setProperty('display', 'block', 'important');
            
            updateHeaderElements(getFallbackHebrewDate(), globalParasha);
            if (globalZmanimData) displayZmanim(globalZmanimData);
        }
    }

    // --- אתחול מערכת ---
    loadCache();
    fetchZmanim();

    setInterval(fetchZmanim, 43200000); // קריאת API ברקע כל 12 שעות
    setInterval(handleScreenCycle, 30000); // החלפת מצב מסך בדיוק כל 30 שניות (30000 מילישניות)
</script>

</body>
</html>
